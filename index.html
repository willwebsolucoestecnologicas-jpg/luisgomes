<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Luís Gomes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>Descubra Luís Gomes ⛰️</h2>
            <!-- Os dados do IBGE aparecerão aqui -->
            <p id="ibge-info">Carregando dados oficiais do IBGE...</p>
        </header>
        
        <main class="chat-box" id="chat-box">
            <div class="message bot">
                Olá! Sou o assistente virtual de Luís Gomes. Pergunte-me sobre a Igreja Matriz, o Piozão, o Mirante ou figuras como Padre Osvaldo e Coronel Fernandes!
            </div>
        </main>
        
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="O que você quer saber sobre a cidade?" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
        
        <footer class="brand-footer">
            Desenvolvido por <strong>WillWeb Soluções Tecnológicas</strong>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
